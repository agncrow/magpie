# The article introducing Magpie (site/index.html), published on GitHub
# Pages (https://agncrow.github.io/magpie/) on every push to main that
# touches it or the icons.
#
# No step runs a JavaScript action, so the workflow needs no Node.js: the
# commit is fetched with git and the page pushed with its icons as the one
# commit of the `gh-pages` branch, which the repository's Pages serve
# (Settings → Pages → Deploy from a branch: gh-pages, /), as crow's book is.
name: Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: The repository at this commit
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" fetch -q --depth 1 --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: The page and its icons
        run: |
          mkdir -p out
          cp site/index.html out/
          cp assets/magpie.svg assets/favicon.ico assets/apple-touch-icon.png assets/magpie-social.png out/
          test -s out/index.html
      # the site as the one commit of gh-pages (no history kept: each push
      # is the whole site), served as it is written (.nojekyll)
      - name: Publish the site to the gh-pages branch
        run: |
          cd out
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="magpie pages" -c user.email="magpie-pages@users.noreply.github.com" commit -q -m "The site at $GITHUB_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" push -q --force "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" gh-pages
